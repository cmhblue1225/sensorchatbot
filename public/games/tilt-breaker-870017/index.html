<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tilt Breaker - 센서 벽돌깨기 게임</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        #game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 20px;
            max-width: 900px;
            width: 95%;
            position: relative;
        }

        #game-header {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid #667eea;
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        #game-content {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #canvas-section {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #gameCanvas {
            border: 4px solid #667eea;
            border-radius: 10px;
            background: #1a1a2e;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 100%;
            height: auto;
        }

        #game-info {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-top: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .info-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            text-align: center;
            flex: 1;
            min-width: 100px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .info-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 1.8em;
            font-weight: bold;
        }

        #session-panel {
            background: white;
            border: 3px solid #667eea;
            border-radius: 15px;
            padding: 20px;
            min-width: 280px;
            max-width: 320px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .panel-title {
            color: #667eea;
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        #qr-code {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            padding: 15px;
            background: white;
            border-radius: 10px;
            min-height: 200px;
            border: 2px dashed #667eea;
        }

        #qr-code img,
        #qr-code canvas {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
        }

        .session-code-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin: 15px 0;
        }

        .session-code-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 5px;
        }

        #session-code {
            font-size: 2em;
            font-weight: bold;
            letter-spacing: 3px;
            font-family: 'Courier New', monospace;
        }

        #sensor-status {
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        #sensor-status.disconnected {
            background: #ffeaa7;
            color: #d63031;
            border: 2px solid #d63031;
        }

        #sensor-status.connected {
            background: #55efc4;
            color: #00b894;
            border: 2px solid #00b894;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .instructions {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-top: 15px;
            border-radius: 5px;
        }

        .instructions h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .instructions ol {
            margin-left: 20px;
            color: #555;
        }

        .instructions li {
            margin: 8px 0;
            line-height: 1.5;
        }

        #game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            border-radius: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #game-overlay.visible {
            opacity: 1;
            pointer-events: all;
        }

        .overlay-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .overlay-content h2 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .overlay-content p {
            color: #555;
            font-size: 1.2em;
            margin: 15px 0;
            line-height: 1.6;
        }

        .overlay-content .score-display {
            font-size: 2em;
            color: #764ba2;
            font-weight: bold;
            margin: 20px 0;
        }

        #restart-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease;
        }

        #restart-button:hover {
            transform: scale(1.05);
        }

        #restart-button:active {
            transform: scale(0.95);
        }

        .loading {
            color: #667eea;
            font-size: 1.2em;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            #game-content {
                flex-direction: column;
            }

            #session-panel {
                max-width: 100%;
            }

            .info-box {
                min-width: 80px;
            }

            .info-value {
                font-size: 1.5em;
            }
        }

        /* 파티클 효과 */
        .particle {
            position: absolute;
            pointer-events: none;
            animation: particle-float 1s ease-out forwards;
        }

        @keyframes particle-float {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        /* 승리 애니메이션 */
        @keyframes victory-bounce {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        .victory {
            animation: victory-bounce 0.5s ease-in-out;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="game-header">
            <h1>🎮 Tilt Breaker</h1>
            <div class="subtitle">스마트폰을 기울여서 벽돌을 깨세요!</div>
        </div>

        <div id="game-content">
            <div id="canvas-section">
                <canvas id="gameCanvas" width="600" height="700"></canvas>
                <div id="game-info">
                    <div class="info-box">
                        <div class="info-label">점수</div>
                        <div class="info-value" id="score-display">0</div>
                    </div>
                    <div class="info-box">
                        <div class="info-label">생명</div>
                        <div class="info-value" id="lives-display">3</div>
                    </div>
                    <div class="info-box">
                        <div class="info-label">레벨</div>
                        <div class="info-value" id="level-display">1</div>
                    </div>
                </div>
            </div>

            <div id="session-panel">
                <div class="panel-title">📱 센서 연결</div>
                
                <div id="qr-code">
                    <div class="loading">QR 코드 생성 중...</div>
                </div>

                <div class="session-code-container">
                    <div class="session-code-label">세션 코드</div>
                    <div id="session-code">----</div>
                </div>

                <div id="sensor-status" class="disconnected">
                    센서 연결 대기 중...
                </div>

                <div class="instructions">
                    <h3>🎯 게임 방법</h3>
                    <ol>
                        <li>QR 코드를 스캔하세요</li>
                        <li>스마트폰을 좌우로 기울여 패들을 움직이세요</li>
                        <li>공을 튕겨서 모든 벽돌을 깨세요</li>
                        <li>공을 3번 놓치면 게임 오버!</li>
                    </ol>
                </div>
            </div>
        </div>

        <div id="game-overlay">
            <div class="overlay-content">
                <h2 id="overlay-title">게임 준비</h2>
                <p id="overlay-message">센서를 연결하면 자동으로 시작됩니다</p>
                <div class="score-display" id="overlay-score" style="display: none;"></div>
                <button id="restart-button" style="display: none;">다시 시작</button>
            </div>
        </div>
    </div>

    <!-- 필수 스크립트 -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/SessionSDK.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <script>
        // ========================================
        // 게임 상수 정의
        // ========================================
        const CANVAS_WIDTH = 600;
        const CANVAS_HEIGHT = 700;
        const PADDLE_WIDTH = 120;
        const PADDLE_HEIGHT = 20;
        const PADDLE_SPEED = 12;
        const BALL_RADIUS = 10;
        const BALL_INITIAL_SPEED = 5;
        const BALL_SPEED_INCREMENT = 0.3;
        const BRICK_ROWS = 6;
        const BRICK_COLS = 8;
        const BRICK_WIDTH = 65;
        const BRICK_HEIGHT = 25;
        const BRICK_PADDING = 5;
        const BRICK_OFFSET_TOP = 80;
        const BRICK_OFFSET_LEFT = 20;
        const MAX_LIVES = 3;
        const TILT_SENSITIVITY = 15;

        // ========================================
        // 게임 변수
        // ========================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameStarted = false;
        let gameOver = false;
        let gamePaused = false;
        let sensorConnected = false;
        let animationId = null;

        let score = 0;
        let lives = MAX_LIVES;
        let level = 1;
        let bricksRemaining = 0;

        // 패들 객체
        const paddle = {
            x: CANVAS_WIDTH / 2 - PADDLE_WIDTH / 2,
            y: CANVAS_HEIGHT - 50,
            width: PADDLE_WIDTH,
            height: PADDLE_HEIGHT,
            speed: PADDLE_SPEED,
            targetX: CANVAS_WIDTH / 2 - PADDLE_WIDTH / 2
        };

        // 공 객체
        const ball = {
            x: CANVAS_WIDTH / 2,
            y: paddle.y - BALL_RADIUS - 5,
            radius: BALL_RADIUS,
            dx: 0,
            dy: 0,
            speed: BALL_INITIAL_SPEED,
            stuck: true
        };

        // 벽돌 배열
        let bricks = [];

        // 센서 데이터
        let currentTilt = 0;
        let lastShakeTime = 0;

        // ========================================
        // SessionSDK 초기화
        // ========================================
        console.log('🎮 Tilt Breaker 게임 초기화 중...');

        const sdk = new SessionSDK({
            gameId: 'tilt-breaker',
            gameType: 'solo'
        });

        // ========================================
        // SDK 이벤트 핸들러
        // ========================================

        // 서버 연결 완료
        sdk.on('connected', () => {
            console.log('✅ 서버 연결 완료');
            createSession();
        });

        // 세션 생성
        function createSession() {
            console.log('🔄 세션 생성 중...');
            sdk.createSession().then(session => {
                console.log('✅ 세션 생성 성공:', session);
            }).catch(error => {
                console.error('❌ 세션 생성 실패:', error);
                alert('세션 생성에 실패했습니다: ' + error.message);
            });
        }

        // 세션 생성 완료
        sdk.on('session-created', (event) => {
            const session = event.detail || event;
            console.info('✅ 세션 생성 완료:', session);

            // 세션 코드 표시
            const sessionCodeEl = document.getElementById('session-code');
            if (sessionCodeEl && session.sessionCode) {
                sessionCodeEl.textContent = session.sessionCode;
                console.info('📱 세션 코드:', session.sessionCode);
            }

            // QR 코드 생성
            setTimeout(() => {
                const qrUrl = `${window.location.origin}/sensor.html?session=${session.sessionCode}`;
                console.info('🔗 QR URL:', qrUrl);
                generateQRCode(qrUrl);
            }, 100);
        });

        // QR 코드 생성 함수
        function generateQRCode(url) {
            const qrContainer = document.getElementById('qr-code');
            if (!qrContainer) return;

            qrContainer.innerHTML = '';

            if (typeof QRCode !== 'undefined') {
                try {
                    new QRCode(qrContainer, {
                        text: url,
                        width: 200,
                        height: 200,
                        colorDark: '#000000',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.H
                    });
                    console.log('✅ QR 코드 생성 완료 (QRCode.js)');
                } catch (error) {
                    console.error('❌ QR 코드 생성 실패:', error);
                    generateQRCodeFallback(url, qrContainer);
                }
            } else {
                console.warn('⚠️ QRCode.js 라이브러리 없음, 폴백 사용');
                generateQRCodeFallback(url, qrContainer);
            }
        }

        // QR 코드 폴백 (외부 API)
        function generateQRCodeFallback(url, container) {
            const img = document.createElement('img');
            img.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}`;
            img.alt = 'QR Code';
            img.style.width = '200px';
            img.style.height = '200px';
            container.appendChild(img);
            console.log('✅ QR 코드 생성 완료 (폴백 API)');
        }

        // 센서 연결됨
        sdk.on('sensor-connected', (event) => {
            const data = event.detail || event;
            console.log('✅ 센서 연결됨:', data.sensorId);

            sensorConnected = true;

            // UI 업데이트
            const statusEl = document.getElementById('sensor-status');
            if (statusEl) {
                statusEl.textContent = '센서 연결됨 ✓';
                statusEl.className = 'connected';
            }

            // 🚀 필수: 센서 연결 1초 후 자동 게임 시작
            setTimeout(() => {
                if (!gameStarted && !gameOver) {
                    console.log('🎮 게임 자동 시작!');
                    startGame();
                }
            }, 1000);
        });

        // 센서 데이터 수신
        sdk.on('sensor-data', (event) => {
            const data = event.detail || event;
            processSensorData(data);
        });

        // 센서 연결 해제
        sdk.on('sensor-disconnected', (event) => {
            const data = event.detail || event;
            console.log('⚠️ 센서 연결 해제:', data.sensorId);

            sensorConnected = false;

            const statusEl = document.getElementById('sensor-status');
            if (statusEl) {
                statusEl.textContent = '센서 연결 대기 중...';
                statusEl.className = 'disconnected';
            }
        });

        // ========================================
        // 센서 데이터 처리
        // ========================================
        function processSensorData(sensorData) {
            if (!sensorData || !sensorData.data) return;

            const { orientation, acceleration } = sensorData.data;

            // 좌우 기울기로 패들 이동 (gamma: -90 ~ 90)
            if (orientation && orientation.gamma !== null && orientation.gamma !== undefined) {
                // gamma 값을 -1 ~ 1로 정규화
                let tiltValue = orientation.gamma / 90;
                
                // 민감도 적용 및 범위 제한
                tiltValue = Math.max(-1, Math.min(1, tiltValue));
                
                // 패들 목표 위치 계산
                paddle.targetX = (CANVAS_WIDTH / 2) + (tiltValue * (CANVAS_WIDTH / 2 - PADDLE_WIDTH / 2));
                
                // 범위 제한
                paddle.targetX = Math.max(0, Math.min(CANVAS_WIDTH - paddle.width, paddle.targetX));
                
                currentTilt = tiltValue;
            }

            // 흔들기 감지 (게임 시작용)
            if (acceleration) {
                const shake = Math.sqrt(
                    (acceleration.x || 0) ** 2 +
                    (acceleration.y || 0) ** 2 +
                    (acceleration.z || 0) ** 2
                );

                const now = Date.now();
                
                // 흔들기로 게임 시작 (연결 후 대기 중일 때)
                if (!gameStarted && !gameOver && shake > 20 && sensorConnected && (now - lastShakeTime > 1000)) {
                    console.log('🔥 흔들기 감지! 게임 시작');
                    lastShakeTime = now;
                    startGame();
                }

                // 게임 오버 후 흔들기로 재시작
                if (gameOver && shake > 25 && (now - lastShakeTime > 1000)) {
                    console.log('🔥 흔들기 감지! 게임 재시작');
                    lastShakeTime = now;
                    resetGame();
                }
            }
        }

        // ========================================
        // 게임 초기화
        // ========================================
        function initGame() {
            console.log('🎮 게임 초기화');

            // 벽돌 생성
            createBricks();

            // 게임 루프 시작
            gameLoop();

            // 초기 오버레이 표시
            showOverlay('센서 연결 대기', '스마트폰으로 QR 코드를 스캔하세요');
        }

        // 벽돌 생성
        function createBricks() {
            bricks = [];
            bricksRemaining = 0;

            const colors = [
                '#e74c3c', // 빨강
                '#e67e22', // 주황
                '#f39c12', // 노랑
                '#2ecc71', // 초록
                '#3498db', // 파랑
                '#9b59b6'  // 보라
            ];

            for (let row = 0; row < BRICK_ROWS; row++) {
                bricks[row] = [];
                for (let col = 0; col < BRICK_COLS; col++) {
                    const brick = {
                        x: BRICK_OFFSET_LEFT + col * (BRICK_WIDTH + BRICK_PADDING),
                        y: BRICK_OFFSET_TOP + row * (BRICK_HEIGHT + BRICK_PADDING),
                        width: BRICK_WIDTH,
                        height: BRICK_HEIGHT,
                        color: colors[row % colors.length],
                        visible: true,
                        points: (BRICK_ROWS - row) * 10 // 위쪽 벽돌일수록 높은 점수
                    };
                    bricks[row][col] = brick;
                    bricksRemaining++;
                }
            }

            console.log(`✅ 벽돌 생성 완료: ${bricksRemaining}개`);
        }

        // ========================================
        // 게임 시작
        // ========================================
        function startGame() {
            if (gameStarted || gameOver) return;

            console.log('🚀 게임 시작!');
            gameStarted = true;
            ball.stuck = false;

            // 공 초기 속도 설정 (랜덤 각도)
            const angle = (Math.random() * 60 - 30) * Math.PI / 180; // -30도 ~ 30도
            ball.dx = ball.speed * Math.sin(angle);
            ball.dy = -ball.speed * Math.cos(angle);

            hideOverlay();
        }

        // ========================================
        // 게임 루프
        // ========================================
        function gameLoop() {
            // 게임 상태 업데이트
            updateGame();

            // 화면 렌더링
            renderGame();

            // 다음 프레임 요청
            animationId = requestAnimationFrame(gameLoop);
        }

        // ========================================
        // 게임 업데이트
        // ========================================
        function updateGame() {
            if (!gameStarted || gamePaused || gameOver) {
                // 게임 시작 전: 공을 패들 위에 고정
                if (!gameStarted && !gameOver) {
                    ball.x = paddle.x + paddle.width / 2;
                    ball.y = paddle.y - ball.radius - 5;
                    ball.dx = 0;
                    ball.dy = 0;
                }
                return;
            }

            // 패들 이동 (부드러운 이동)
            const paddleDiff = paddle.targetX - paddle.x;
            if (Math.abs(paddleDiff) > 1) {
                paddle.x += paddleDiff * 0.2; // 부드러운 이징
            }

            // 패들 범위 제한
            paddle.x = Math.max(0, Math.min(CANVAS_WIDTH - paddle.width, paddle.x));

            // 공이 붙어있지 않을 때만 이동
            if (!ball.stuck) {
                ball.x += ball.dx;
                ball.y += ball.dy;

                // 벽 충돌 감지 (좌우)
                if (ball.x - ball.radius <= 0 || ball.x + ball.radius >= CANVAS_WIDTH) {
                    ball.dx = -ball.dx;
                    ball.x = Math.max(ball.radius, Math.min(CANVAS_WIDTH - ball.radius, ball.x));
                    playSound('wall');
                }

                // 벽 충돌 감지 (위)
                if (ball.y - ball.radius <= 0) {
                    ball.dy = -ball.dy;
                    ball.y = ball.radius;
                    playSound('wall');
                }

                // 패들 충돌 감지
                if (ball.y + ball.radius >= paddle.y &&
                    ball.y + ball.radius <= paddle.y + paddle.height &&
                    ball.x >= paddle.x &&
                    ball.x <= paddle.x + paddle.width &&
                    ball.dy > 0) {
                    
                    // 패들의 어느 위치에 맞았는지에 따라 반사 각도 조정
                    const hitPos = (ball.x - paddle.x) / paddle.width; // 0 ~ 1
                    const angle = (hitPos - 0.5) * 120; // -60도 ~ 60도
                    const speed = Math.sqrt(ball.dx ** 2 + ball.dy ** 2);
                    
                    ball.dx = speed * Math.sin(angle * Math.PI / 180);
                    ball.dy = -speed * Math.cos(angle * Math.PI / 180);
                    
                    ball.y = paddle.y - ball.radius;
                    
                    playSound('paddle');
                }

                // 공이 바닥에 떨어짐
                if (ball.y - ball.radius > CANVAS_HEIGHT) {
                    loseLife();
                }

                // 벽돌 충돌 감지
                checkBrickCollision();
            }
        }

        // ========================================
        // 벽돌 충돌 감지
        // ========================================
        function checkBrickCollision() {
            for (let row = 0; row < BRICK_ROWS; row++) {
                for (let col = 0; col < BRICK_COLS; col++) {
                    const brick = bricks[row][col];
                    
                    if (!brick.visible) continue;

                    // AABB 충돌 감지
                    if (ball.x + ball.radius > brick.x &&
                        ball.x - ball.radius < brick.x + brick.width &&
                        ball.y + ball.radius > brick.y &&
                        ball.y - ball.radius < brick.y + brick.height) {
                        
                        // 벽돌 파괴
                        brick.visible = false;
                        bricksRemaining--;
                        
                        // 점수 추가
                        score += brick.points;
                        updateScoreDisplay();
                        
                        // 파티클 효과
                        createParticles(brick.x + brick.width / 2, brick.y + brick.height / 2, brick.color);
                        
                        // 공 반사 (충돌 위치에 따라)
                        const ballCenterX = ball.x;
                        const ballCenterY = ball.y;
                        const brickCenterX = brick.x + brick.width / 2;
                        const brickCenterY = brick.y + brick.height / 2;
                        
                        const dx = ballCenterX - brickCenterX;
                        const dy = ballCenterY - brickCenterY;
                        
                        if (Math.abs(dx) > Math.abs(dy)) {
                            // 좌우 충돌
                            ball.dx = -ball.dx;
                        } else {
                            // 상하 충돌
                            ball.dy = -ball.dy;
                        }
                        
                        playSound('brick');
                        
                        // 모든 벽돌을 깼는지 확인
                        if (bricksRemaining === 0) {
                            levelComplete();
                        }
                        
                        return; // 한 프레임에 하나의 벽돌만 처리
                    }
                }
            }
        }

        // ========================================
        // 생명 감소
        // ========================================
        function loseLife() {
            lives--;
            updateLivesDisplay();
            
            console.log(`💔 생명 감소: ${lives} 남음`);
            
            if (lives <= 0) {
                // 게임 오버
                endGame(false);
            } else {
                // 공 리셋
                resetBall();
                playSound('lose');
            }
        }

        // ========================================
        // 공 리셋
        // ========================================
        function resetBall() {
            ball.x = paddle.x + paddle.width / 2;
            ball.y = paddle.y - ball.radius - 5;
            ball.dx = 0;
            ball.dy = 0;
            ball.stuck = true;
            gameStarted = false;
            
            // 1초 후 자동 재시작
            setTimeout(() => {
                if (!gameOver && sensorConnected) {
                    startGame();
                }
            }, 1000);
        }

        // ========================================
        // 레벨 완료
        // ========================================
        function levelComplete() {
            console.log('🎉 레벨 완료!');
            
            level++;
            updateLevelDisplay();
            
            // 보너스 점수
            score += 500 * level;
            updateScoreDisplay();
            
            // 공 속도 증가
            ball.speed += BALL_SPEED_INCREMENT;
            
            // 다음 레벨 준비
            createBricks();
            resetBall();
            
            playSound('levelup');
            
            // 레벨 5 클리어 시 승리
            if (level > 5) {
                endGame(true);
            } else {
                showOverlay(`레벨 ${level}`, '잠시 후 다음 레벨이 시작됩니다', 2000);
            }
        }

        // ========================================
        // 게임 종료
        // ========================================
        function endGame(victory) {
            console.log(victory ? '🏆 게임 승리!' : '💀 게임 오버!');
            
            gameStarted = false;
            gameOver = true;
            
            if (victory) {
                showGameOverOverlay('🏆 승리!', `축하합니다! 모든 레벨을 클리어했습니다!`, score);
                playSound('victory');
            } else {
                showGameOverOverlay('💀 게임 오버', '다시 도전해보세요!', score);
                playSound('gameover');
            }
        }

        // ========================================
        // 게임 리셋
        // ========================================
        function resetGame() {
            console.log('🔄 게임 리셋');
            
            // 게임 상태 초기화
            gameStarted = false;
            gameOver = false;
            gamePaused = false;
            
            score = 0;
            lives = MAX_LIVES;
            level = 1;
            
            // 공 초기화
            ball.speed = BALL_INITIAL_SPEED;
            ball.stuck = true;
            
            // 패들 초기화
            paddle.x = CANVAS_WIDTH / 2 - PADDLE_WIDTH / 2;
            paddle.targetX = paddle.x;
            
            // 벽돌 재생성
            createBricks();
            
            // 공 위치 리셋
            resetBall();
            
            // UI 업데이트
            updateScoreDisplay();
            updateLivesDisplay();
            updateLevelDisplay();
            
            hideOverlay();
            
            // 센서가 연결되어 있으면 자동 시작
            if (sensorConnected) {
                setTimeout(() => {
                    startGame();
                }, 1000);
            }
        }

        // ========================================
        // 렌더링
        // ========================================
        function renderGame() {
            // 캔버스 초기화
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            // 배경 그리드
            drawGrid();
            
            // 벽돌 그리기
            drawBricks();
            
            // 패들 그리기
            drawPaddle();
            
            // 공 그리기
            drawBall();
            
            // 상단 정보 표시
            drawTopInfo();
        }

        // 배경 그리드
        function drawGrid() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            
            // 세로선
            for (let x = 0; x < CANVAS_WIDTH; x += 50) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, CANVAS_HEIGHT);
                ctx.stroke();
            }
            
            // 가로선
            for (let y = 0; y < CANVAS_HEIGHT; y += 50) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(CANVAS_WIDTH, y);
                ctx.stroke();
            }
        }

        // 벽돌 그리기
        function drawBricks() {
            for (let row = 0; row < BRICK_ROWS; row++) {
                for (let col = 0; col < BRICK_COLS; col++) {
                    const brick = bricks[row][col];
                    
                    if (!brick.visible) continue;
                    
                    // 벽돌 그림자
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                    ctx.fillRect(brick.x + 3, brick.y + 3, brick.width, brick.height);
                    
                    // 벽돌 본체
                    ctx.fillStyle = brick.color;
                    ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
                    
                    // 벽돌 하이라이트
                    const gradient = ctx.createLinearGradient(brick.x, brick.y, brick.x, brick.y + brick.height);
                    gradient.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
                    gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
                    
                    // 벽돌 테두리
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(brick.x, brick.y, brick.width, brick.height);
                    
                    // 점수 표시
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                    ctx.font = 'bold 12px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(brick.points, brick.x + brick.width / 2, brick.y + brick.height / 2);
                }
            }
        }

        // 패들 그리기
        function drawPaddle() {
            // 패들 그림자
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(paddle.x + 3, paddle.y + 3, paddle.width, paddle.height);
            
            // 패들 본체 (그라디언트)
            const gradient = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.height);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#764ba2');
            ctx.fillStyle = gradient;
            
            // 둥근 모서리
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 10);
            ctx.fill();
            
            // 패들 하이라이트
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height / 2, [10, 10, 0, 0]);
            ctx.fill();
            
            // 패들 테두리
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 10);
            ctx.stroke();
            
            // 기울기 인디케이터
            if (sensorConnected) {
                const indicatorX = paddle.x + paddle.width / 2 + (currentTilt * paddle.width / 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.beginPath();
                ctx.arc(indicatorX, paddle.y + paddle.height / 2, 4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 공 그리기
        function drawBall() {
            // 공 그림자
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.beginPath();
            ctx.arc(ball.x + 3, ball.y + 3, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            
            // 공 본체 (그라디언트)
            const gradient = ctx.createRadialGradient(
                ball.x - ball.radius / 3,
                ball.y - ball.radius / 3,
                ball.radius / 4,
                ball.x,
                ball.y,
                ball.radius
            );
            gradient.addColorStop(0, '#ffffff');
            gradient.addColorStop(0.5, '#f39c12');
            gradient.addColorStop(1, '#e67e22');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            
            // 공 테두리
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.stroke();
            
            // 공 궤적 표시 (게임 시작 전)
            if (!gameStarted && !gameOver) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(ball.x, ball.y);
                ctx.lineTo(ball.x, ball.y - 100);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        // 상단 정보 표시
        function drawTopInfo() {
            // 반투명 배경
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.fillRect(0, 0, CANVAS_WIDTH, 60);
            
            // 게임 제목
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('TILT BREAKER', CANVAS_WIDTH / 2, 35);
            
            // 상태 메시지
            if (!gameStarted && !gameOver && sensorConnected) {
                ctx.fillStyle = '#f39c12';
                ctx.font = '16px Arial';
                ctx.fillText('흔들어서 시작하세요!', CANVAS_WIDTH / 2, 55);
            } else if (!sensorConnected) {
                ctx.fillStyle = '#e74c3c';
                ctx.font = '16px Arial';
                ctx.fillText('센서를 연결하세요', CANVAS_WIDTH / 2, 55);
            }
        }

        // ========================================
        // UI 업데이트
        // ========================================
        function updateScoreDisplay() {
            const scoreEl = document.getElementById('score-display');
            if (scoreEl) {
                scoreEl.textContent = score;
            }
        }

        function updateLivesDisplay() {
            const livesEl = document.getElementById('lives-display');
            if (livesEl) {
                livesEl.textContent = lives;
                
                // 생명이 적을 때 색상 변경
                const infoBox = livesEl.closest('.info-box');
                if (infoBox) {
                    if (lives === 1) {
                        infoBox.style.background = 'linear-gradient(135deg, #e74c3c 0%, #c0392b 100%)';
                    } else if (lives === 2) {
                        infoBox.style.background = 'linear-gradient(135deg, #f39c12 0%, #e67e22 100%)';
                    } else {
                        infoBox.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                    }
                }
            }
        }

        function updateLevelDisplay() {
            const levelEl = document.getElementById('level-display');
            if (levelEl) {
                levelEl.textContent = level;
            }
        }

        // ========================================
        // 오버레이 관리
        // ========================================
        function showOverlay(title, message, duration = 0) {
            const overlay = document.getElementById('game-overlay');
            const titleEl = document.getElementById('overlay-title');
            const messageEl = document.getElementById('overlay-message');
            const scoreEl = document.getElementById('overlay-score');
            const restartBtn = document.getElementById('restart-button');
            
            if (titleEl) titleEl.textContent = title;
            if (messageEl) messageEl.textContent = message;
            if (scoreEl) scoreEl.style.display = 'none';
            if (restartBtn) restartBtn.style.display = 'none';
            
            if (overlay) {
                overlay.classList.add('visible');
            }
            
            if (duration > 0) {
                setTimeout(() => {
                    hideOverlay();
                }, duration);
            }
        }

        function showGameOverOverlay(title, message, finalScore) {
            const overlay = document.getElementById('game-overlay');
            const titleEl = document.getElementById('overlay-title');
            const messageEl = document.getElementById('overlay-message');
            const scoreEl = document.getElementById('overlay-score');
            const restartBtn = document.getElementById('restart-button');
            
            if (titleEl) titleEl.textContent = title;
            if (messageEl) messageEl.textContent = message;
            if (scoreEl) {
                scoreEl.textContent = `최종 점수: ${finalScore}`;
                scoreEl.style.display = 'block';
            }
            if (restartBtn) {
                restartBtn.style.display = 'inline-block';
            }
            
            if (overlay) {
                overlay.classList.add('visible');
            }
        }

        function hideOverlay() {
            const overlay = document.getElementById('game-overlay');
            if (overlay) {
                overlay.classList.remove('visible');
            }
        }

        // ========================================
        // 파티클 효과
        // ========================================
        function createParticles(x, y, color) {
            const particleCount = 8;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.position = 'absolute';
                particle.style.left = (x * canvas.offsetWidth / CANVAS_WIDTH) + 'px';
                particle.style.top = (y * canvas.offsetHeight / CANVAS_HEIGHT) + 'px';
                particle.style.width = '8px';
                particle.style.height = '8px';
                particle.style.borderRadius = '50%';
                particle.style.backgroundColor = color;
                
                const angle = (i / particleCount) * Math.PI * 2;
                const distance = 50 + Math.random() * 50;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                
                canvas.parentElement.appendChild(particle);
                
                setTimeout(() => {
                    particle.remove();
                }, 1000);
            }
        }

        // ========================================
        // 사운드 효과 (시각적 피드백으로 대체)
        // ========================================
        function playSound(type) {
            // 실제 게임에서는 Web Audio API를 사용하여 사운드 재생
            // 여기서는 시각적 피드백으로 대체
            
            switch(type) {
                case 'brick':
                    // 벽돌 파괴 효과는 파티클로 표현
                    break;
                case 'paddle':
                    // 패들 충돌 시 패들 깜빡임
                    flashElement(canvas, 'rgba(102, 126, 234, 0.3)');
                    break;
                case 'wall':
                    // 벽 충돌 시 화면 테두리 깜빡임
                    flashElement(canvas, 'rgba(255, 255, 255, 0.2)');
                    break;
                case 'lose':
                    // 생명 감소 시 빨간색 깜빡임
                    flashElement(canvas, 'rgba(231, 76, 60, 0.4)');
                    break;
                case 'levelup':
                    // 레벨업 시 초록색 깜빡임
                    flashElement(canvas, 'rgba(46, 204, 113, 0.4)');
                    break;
                case 'victory':
                    // 승리 시 금색 깜빡임
                    flashElement(canvas, 'rgba(241, 196, 15, 0.5)');
                    break;
                case 'gameover':
                    // 게임오버 시 어두운 깜빡임
                    flashElement(canvas, 'rgba(0, 0, 0, 0.5)');
                    break;
            }
        }

        function flashElement(element, color) {
            const flash = document.createElement('div');
            flash.style.position = 'absolute';
            flash.style.top = element.offsetTop + 'px';
            flash.style.left = element.offsetLeft + 'px';
            flash.style.width = element.offsetWidth + 'px';
            flash.style.height = element.offsetHeight + 'px';
            flash.style.backgroundColor = color;
            flash.style.pointerEvents = 'none';
            flash.style.borderRadius = '10px';
            flash.style.transition = 'opacity 0.3s ease';
            flash.style.opacity = '1';
            
            element.parentElement.appendChild(flash);
            
            setTimeout(() => {
                flash.style.opacity = '0';
                setTimeout(() => {
                    flash.remove();
                }, 300);
            }, 50);
        }

        // ========================================
        // 이벤트 리스너
        // ========================================

        // 재시작 버튼
        document.getElementById('restart-button').addEventListener('click', () => {
            resetGame();
        });

        // 캔버스 클릭으로 게임 시작
        canvas.addEventListener('click', () => {
            if (!gameStarted && !gameOver && sensorConnected) {
                startGame();
            }
        });

        // 키보드 컨트롤 (테스트용)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') {
                paddle.targetX = Math.max(0, paddle.x - 30);
            } else if (e.key === 'ArrowRight') {
                paddle.targetX = Math.min(CANVAS_WIDTH - paddle.width, paddle.x + 30);
            } else if (e.key === ' ' || e.key === 'Enter') {
                if (!gameStarted && !gameOver && sensorConnected) {
                    startGame();
                } else if (gameOver) {
                    resetGame();
                }
            } else if (e.key === 'Escape') {
                gamePaused = !gamePaused;
            }
        });

        // 창 크기 변경 시 캔버스 비율 유지
        window.addEventListener('resize', () => {
            // 캔버스는 CSS로 반응형 처리되므로 별도 처리 불필요
        });

        // ========================================
        // 게임 시작
        // ========================================
        console.log('🎮 Tilt Breaker 초기화 완료');
        initGame();

    </script>
