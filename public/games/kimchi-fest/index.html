<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kimchi Fest | Prototype Shell</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header,
        footer {
            padding: 1.5rem;
            text-align: center;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            padding: 1.5rem;
        }

        .hud {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1rem;
        }

        .card {
            padding: 1rem;
            border-radius: 1rem;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .stage-board {
            flex: 1;
            display: grid;
            gap: 1rem;
        }

        .placeholder {
            border: 1px dashed rgba(148, 163, 184, 0.4);
            border-radius: 1rem;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(148, 163, 184, 0.8);
        }

        button {
            appearance: none;
            border: none;
            border-radius: 999px;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            color: #0f172a;
            background: linear-gradient(135deg, #f97316, #22c55e);
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <header>
        <h1>Kimchi Fest</h1>
        <p class="subtitle">양념을 모으고 배추에 바를 준비를 하세요!</p>
    </header>
    <main>
        <section class="hud" aria-label="Heads-up display">
            <div class="card" id="timer-card">
                <h2>남은 시간</h2>
                <p id="timer">00:45</p>
            </div>
            <div class="card" id="score-card">
                <h2>총 점수</h2>
                <p id="score">0</p>
            </div>
            <div class="card" id="players-card">
                <h2>연결 플레이어</h2>
                <p id="player-count">0</p>
            </div>
            <div class="card" id="stage-card">
                <h2>현재 단계</h2>
                <p id="stage">대기 중</p>
            </div>
        </section>

        <section class="stage-board" aria-label="Game board">
            <div class="placeholder" id="metronome-placeholder">메트로놈 / 타이밍 표시 영역</div>
            <div class="placeholder" id="playfield-placeholder">플레이필드(양념 &amp; 배추) 영역</div>
            <div class="placeholder" id="feedback-placeholder">판정 &amp; 피드백 영역</div>
        </section>

        <section class="card" aria-label="Controls">
            <h2>제어</h2>
            <p>이 섹션은 이후 단계에서 SessionSDK와 연동되어 센서 연결 및 재시작 버튼을 제공합니다.</p>
            <button id="start-button" disabled>준비 중...</button>
        </section>
    </main>
    <footer>
        <small>Kimchi Fest Prototype &bull; Sensor Game Hub v6.0</small>
    </footer>
</body>
</html>
