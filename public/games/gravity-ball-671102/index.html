<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Ball - 중력 공 굴리기 게임</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #gameCanvas {
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            display: block;
            max-width: 100%;
            height: auto;
            border: 4px solid rgba(255, 255, 255, 0.1);
        }

        .session-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            min-width: 280px;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .session-panel h2 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #333;
            font-weight: 700;
            text-align: center;
        }

        .session-info {
            margin: 15px 0;
            text-align: center;
        }

        .session-info label {
            display: block;
            font-size: 13px;
            color: #666;
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #session-code {
            font-size: 32px;
            font-weight: 800;
            color: #667eea;
            letter-spacing: 4px;
            font-family: 'Courier New', monospace;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        #qr-code {
            margin: 20px auto;
            padding: 15px;
            background: white;
            border-radius: 15px;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        #qr-code img,
        #qr-code canvas {
            display: block;
            margin: 0 auto;
            border-radius: 10px;
        }

        #sensor-status {
            padding: 12px 20px;
            border-radius: 25px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            margin-top: 15px;
            transition: all 0.3s ease;
        }

        #sensor-status.disconnected {
            background: #ff6b6b;
            color: white;
        }

        #sensor-status.connected {
            background: #51cf66;
            color: white;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .game-info {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            min-width: 200px;
            z-index: 1000;
        }

        .game-info-item {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .game-info-label {
            font-size: 14px;
            color: #666;
            font-weight: 600;
        }

        .game-info-value {
            font-size: 24px;
            font-weight: 800;
            color: #667eea;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .overlay.hidden {
            display: none;
        }

        .overlay-content {
            text-align: center;
            color: white;
            padding: 40px;
            max-width: 500px;
        }

        .overlay-title {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(102, 126, 234, 0.8);
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 20px rgba(102, 126, 234, 0.8); }
            50% { text-shadow: 0 0 40px rgba(102, 126, 234, 1); }
        }

        .overlay-message {
            font-size: 20px;
            margin-bottom: 30px;
            line-height: 1.6;
            color: #ddd;
        }

        .overlay-instruction {
            font-size: 16px;
            color: #aaa;
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 800;
            color: #51cf66;
        }

        .stat-label {
            font-size: 14px;
            color: #aaa;
            margin-top: 5px;
        }

        /* 반응형 디자인 */
        @media (max-width: 768px) {
            .session-panel {
                top: 10px;
                left: 10px;
                padding: 15px;
                min-width: 200px;
            }

            .session-panel h2 {
                font-size: 16px;
            }

            #session-code {
                font-size: 24px;
            }

            .game-info {
                top: 10px;
                right: 10px;
                padding: 15px;
                min-width: 150px;
            }

            .overlay-title {
                font-size: 32px;
            }

            .overlay-message {
                font-size: 16px;
            }
        }

        /* 파티클 효과 */
        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.5; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 1; }
        }

        /* 로딩 애니메이션 */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- 세션 패널 -->
        <div class="session-panel">
            <h2>🎮 Gravity Ball</h2>
            <div class="session-info">
                <label>세션 코드</label>
                <div id="session-code">----</div>
            </div>
            <div id="qr-code"></div>
            <div id="sensor-status" class="disconnected">센서 연결 대기 중...</div>
        </div>

        <!-- 게임 정보 패널 -->
        <div class="game-info">
            <div class="game-info-item">
                <span class="game-info-label">점수</span>
                <span class="game-info-value" id="score-display">0</span>
            </div>
            <div class="game-info-item">
                <span class="game-info-label">시간</span>
                <span class="game-info-value" id="time-display">0</span>
            </div>
            <div class="game-info-item">
                <span class="game-info-label">레벨</span>
                <span class="game-info-value" id="level-display">1</span>
            </div>
        </div>

        <!-- 게임 캔버스 -->
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <!-- 오버레이 -->
        <div id="overlay" class="overlay">
            <div class="overlay-content">
                <div class="overlay-title" id="overlay-title">Gravity Ball</div>
                <div class="overlay-message" id="overlay-message">
                    핸드폰으로 QR 코드를 스캔하여<br>
                    센서를 연결하세요!
                </div>
                <div class="overlay-instruction">
                    📱 핸드폰을 기울여서 공을 조작하세요<br>
                    🎯 모든 별을 수집하면 클리어!<br>
                    ⚠️ 구멍에 빠지지 않도록 조심하세요
                </div>
            </div>
        </div>
    </div>

    <!-- 필수 스크립트 -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/SessionSDK.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <script>
        // ==================== 게임 상수 정의 ====================
        const GAME_CONFIG = {
            CANVAS_WIDTH: 800,
            CANVAS_HEIGHT: 600,
            BALL_RADIUS: 15,
            BALL_MAX_SPEED: 8,
            BALL_ACCELERATION: 0.5,
            BALL_FRICTION: 0.98,
            GRAVITY_MULTIPLIER: 0.3,
            HOLE_RADIUS: 30,
            STAR_RADIUS: 20,
            WALL_THICKNESS: 20,
            OBSTACLE_WIDTH: 100,
            OBSTACLE_HEIGHT: 20
        };

        // ==================== 게임 변수 ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameStarted = false;
        let gameOver = false;
        let gamePaused = false;
        let sensorConnected = false;

        let score = 0;
        let level = 1;
        let startTime = 0;
        let elapsedTime = 0;

        // 공 객체
        let ball = {
            x: GAME_CONFIG.CANVAS_WIDTH / 2,
            y: GAME_CONFIG.CANVAS_HEIGHT / 2,
            radius: GAME_CONFIG.BALL_RADIUS,
            vx: 0,
            vy: 0,
            color: '#4ecdc4'
        };

        // 센서 데이터
        let sensorData = {
            tiltX: 0,
            tiltY: 0,
            shake: 0
        };

        // 게임 오브젝트
        let stars = [];
        let holes = [];
        let obstacles = [];
        let particles = [];

        // ==================== SessionSDK 초기화 ====================
        console.log('🎮 Gravity Ball 게임 초기화 시작...');

        const sdk = new SessionSDK({
            gameId: 'gravity-ball',
            gameType: 'solo'
        });

        // 서버 연결 완료
        sdk.on('connected', () => {
            console.log('✅ 서버 연결 완료');
            createSession();
        });

        // 세션 생성
        function createSession() {
            console.log('🔄 세션 생성 중...');
            sdk.createSession().then(session => {
                console.log('✅ 세션 생성 완료:', session);
            }).catch(error => {
                console.error('❌ 세션 생성 실패:', error);
                alert('세션 생성에 실패했습니다: ' + error.message);
            });
        }

        // 세션 생성 완료 이벤트
        sdk.on('session-created', (event) => {
            const session = event.detail || event;
            console.info('✅ 세션 생성 완료:', session);

            // 세션 코드 표시
            const sessionCodeEl = document.getElementById('session-code');
            if (sessionCodeEl && session.sessionCode) {
                sessionCodeEl.textContent = session.sessionCode;
                console.info('📱 세션 코드:', session.sessionCode);
            }

            // QR 코드 생성
            setTimeout(() => {
                const qrUrl = `${window.location.origin}/sensor.html?session=${session.sessionCode}`;
                console.info('🔗 QR URL:', qrUrl);
                generateQRCode(qrUrl);
            }, 100);
        });

        // QR 코드 생성 함수
        function generateQRCode(url) {
            const qrContainer = document.getElementById('qr-code');
            if (!qrContainer) return;

            qrContainer.innerHTML = '';

            if (typeof QRCode !== 'undefined') {
                try {
                    new QRCode(qrContainer, {
                        text: url,
                        width: 200,
                        height: 200,
                        colorDark: '#000000',
                        colorLight: '#ffffff',
                        correctLevel: QRCode.CorrectLevel.H
                    });
                    console.log('✅ QR 코드 생성 완료 (QRCode.js)');
                } catch (error) {
                    console.error('❌ QR 코드 생성 실패:', error);
                    generateQRCodeFallback(url, qrContainer);
                }
            } else {
                console.warn('⚠️ QRCode.js 라이브러리 없음, 폴백 사용');
                generateQRCodeFallback(url, qrContainer);
            }
        }

        // QR 코드 폴백
        function generateQRCodeFallback(url, container) {
            const img = document.createElement('img');
            img.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}`;
            img.alt = 'QR Code';
            img.style.width = '200px';
            img.style.height = '200px';
            container.appendChild(img);
            console.log('✅ QR 코드 생성 완료 (폴백 API)');
        }

        // 센서 연결 이벤트
        sdk.on('sensor-connected', (event) => {
            const data = event.detail || event;
            console.log('✅ 센서 연결됨:', data.sensorId);

            sensorConnected = true;

            // UI 업데이트
            const statusEl = document.getElementById('sensor-status');
            if (statusEl) {
                statusEl.textContent = '센서 연결됨 ✓';
                statusEl.className = 'connected';
            }

            // 🚀 중요: 센서 연결 1초 후 자동 게임 시작
            setTimeout(() => {
                if (!gameStarted && !gameOver) {
                    startGame();
                    console.log('🎮 게임 자동 시작!');
                }
            }, 1000);
        });

        // 센서 데이터 수신
        sdk.on('sensor-data', (event) => {
            const data = event.detail || event;
            processSensorData(data);
        });

        // 센서 연결 해제
        sdk.on('sensor-disconnected', (event) => {
            const data = event.detail || event;
            console.log('⚠️ 센서 연결 해제:', data.sensorId);

            sensorConnected = false;

            const statusEl = document.getElementById('sensor-status');
            if (statusEl) {
                statusEl.textContent = '센서 연결 대기 중...';
                statusEl.className = 'disconnected';
            }

            // 게임 일시정지
            if (gameStarted && !gameOver) {
                gamePaused = true;
                showOverlay('센서 연결이 끊어졌습니다', '다시 연결해주세요');
            }
        });

        // ==================== 센서 데이터 처리 ====================
        function processSensorData(data) {
            if (!data.data) return;

            const { orientation, acceleration } = data.data;

            if (orientation) {
                // beta: 앞뒤 기울기 (-180 ~ 180)
                // gamma: 좌우 기울기 (-90 ~ 90)
                sensorData.tiltX = Math.max(-1, Math.min(1, orientation.gamma / 45));
                sensorData.tiltY = Math.max(-1, Math.min(1, orientation.beta / 45));
            }

            if (acceleration) {
                // 흔들기 감지
                const shake = Math.sqrt(
                    acceleration.x ** 2 +
                    acceleration.y ** 2 +
                    acceleration.z ** 2
                );
                sensorData.shake = shake;

                // 흔들기로 게임 시작
                if (!gameStarted && shake > 20 && sensorConnected && !gameOver) {
                    startGame();
                    console.log('🎮 흔들기로 게임 시작!');
                }

                // 흔들기로 재시작
                if (gameOver && shake > 25) {
                    resetGame();
                    console.log('🔄 흔들기로 게임 재시작!');
                }
            }
        }

        // ==================== 게임 초기화 ====================
        function initGame() {
            console.log('🎮 게임 초기화...');

            // 캔버스 크기 설정
            resizeCanvas();

            // 레벨 생성
            generateLevel(level);

            // 공 초기 위치
            ball.x = GAME_CONFIG.CANVAS_WIDTH / 2;
            ball.y = GAME_CONFIG.CANVAS_HEIGHT / 2;
            ball.vx = 0;
            ball.vy = 0;

            // 게임 루프 시작
            requestAnimationFrame(gameLoop);

            console.log('✅ 게임 초기화 완료');
        }

        // 캔버스 크기 조정
        function resizeCanvas() {
            const container = document.getElementById('game-container');
            const maxWidth = Math.min(800, window.innerWidth - 40);
            const maxHeight = Math.min(600, window.innerHeight - 200);
            const scale = Math.min(maxWidth / 800, maxHeight / 600);

            canvas.style.width = (800 * scale) + 'px';
            canvas.style.height = (600 * scale) + 'px';
        }

        // 레벨 생성
        function generateLevel(levelNum) {
            stars = [];
            holes = [];
            obstacles = [];

            const starCount = 3 + levelNum;
            const holeCount = 2 + Math.floor(levelNum / 2);
            const obstacleCount = 1 + Math.floor(levelNum / 3);

            // 별 생성
            for (let i = 0; i < starCount; i++) {
                let star;
                let attempts = 0;
                do {
                    star = {
                        x: Math.random() * (GAME_CONFIG.CANVAS_WIDTH - 100) + 50,
                        y: Math.random() * (GAME_CONFIG.CANVAS_HEIGHT - 100) + 50,
                        radius: GAME_CONFIG.STAR_RADIUS,
                        collected: false,
                        rotation: 0,
                        pulsePhase: Math.random() * Math.PI * 2
                    };
                    attempts++;
                } while (isOverlapping(star, [...stars, ...holes]) && attempts < 50);

                if (attempts < 50) {
                    stars.push(star);
                }
            }

            // 구멍 생성
            for (let i = 0; i < holeCount; i++) {
                let hole;
                let attempts = 0;
                do {
                    hole = {
                        x: Math.random() * (GAME_CONFIG.CANVAS_WIDTH - 100) + 50,
                        y: Math.random() * (GAME_CONFIG.CANVAS_HEIGHT - 100) + 50,
                        radius: GAME_CONFIG.HOLE_RADIUS
                    };
                    attempts++;
                } while (isOverlapping(hole, [...stars, ...holes, { x: ball.x, y: ball.y, radius: 100 }]) && attempts < 50);

                if (attempts < 50) {
                    holes.push(hole);
                }
            }

            // 장애물 생성
            for (let i = 0; i < obstacleCount; i++) {
                let obstacle;
                let attempts = 0;
                do {
                    obstacle = {
                        x: Math.random() * (GAME_CONFIG.CANVAS_WIDTH - GAME_CONFIG.OBSTACLE_WIDTH - 100) + 50,
                        y: Math.random() * (GAME_CONFIG.CANVAS_HEIGHT - GAME_CONFIG.OBSTACLE_HEIGHT - 100) + 50,
                        width: GAME_CONFIG.OBSTACLE_WIDTH,
                        height: GAME_CONFIG.OBSTACLE_HEIGHT
                    };
                    attempts++;
                } while (isObstacleOverlapping(obstacle, [...stars, ...holes, { x: ball.x, y: ball.y, radius: 100 }]) && attempts < 50);

                if (attempts < 50) {
                    obstacles.push(obstacle);
                }
            }

            console.log(`✅ 레벨 ${levelNum} 생성: 별 ${stars.length}개, 구멍 ${holes.length}개, 장애물 ${obstacles.length}개`);
        }

        // 오브젝트 겹침 체크
        function isOverlapping(obj, objects) {
            for (let other of objects) {
                const dx = obj.x - other.x;
                const dy = obj.y - other.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const minDistance = (obj.radius || 0) + (other.radius || 0) + 50;

                if (distance < minDistance) {
                    return true;
                }
            }
            return false;
        }

        // 장애물 겹침 체크
        function isObstacleOverlapping(obstacle, objects) {
            for (let obj of objects) {
                if (obj.radius) {
                    // 원형 오브젝트와의 충돌
                    const closestX = Math.max(obstacle.x, Math.min(obj.x, obstacle.x + obstacle.width));
                    const closestY = Math.max(obstacle.y, Math.min(obj.y, obstacle.y + obstacle.height));
                    const dx = obj.x - closestX;
                    const dy = obj.y - closestY;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < obj.radius + 50) {
                        return true;
                    }
                }
            }
            return false;
        }

        // ==================== 게임 시작 ====================
        function startGame() {
            if (gameStarted) return;

            console.log('🚀 게임 시작!');
            gameStarted = true;
            gameOver = false;
            gamePaused = false;
            startTime = Date.now();

            hideOverlay();
        }

        // ==================== 게임 루프 ====================
        function gameLoop() {
            updateGame();
            renderGame();
            requestAnimationFrame(gameLoop);
        }

        // ==================== 게임 업데이트 ====================
        function updateGame() {
            if (!gameStarted || gameOver || gamePaused) return;

            // 시간 업데이트
            elapsedTime = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('time-display').textContent = elapsedTime;

            // 중력 적용 (센서 기울기)
            const gravityX = sensorData.tiltX * GAME_CONFIG.GRAVITY_MULTIPLIER;
            const gravityY = sensorData.tiltY * GAME_CONFIG.GRAVITY_MULTIPLIER;

            ball.vx += gravityX;
            ball.vy += gravityY;

            // 최대 속도 제한
            const speed = Math.sqrt(ball.vx ** 2 + ball.vy ** 2);
            if (speed > GAME_CONFIG.BALL_MAX_SPEED) {
                ball.vx = (ball.vx / speed) * GAME_CONFIG.BALL_MAX_SPEED;
                ball.vy = (ball.vy / speed) * GAME_CONFIG.BALL_MAX_SPEED;
            }

            // 마찰력 적용
            ball.vx *= GAME_CONFIG.BALL_FRICTION;
            ball.vy *= GAME_CONFIG.BALL_FRICTION;

            // 공 이동
            ball.x += ball.vx;
            ball.y += ball.vy;

            // 벽 충돌
            checkWallCollision();

            // 장애물 충돌
            checkObstacleCollision();

            // 별 수집
            checkStarCollection();

            // 구멍 충돌
            checkHoleCollision();

            // 파티클 업데이트
            updateParticles();

            // 레벨 클리어 체크
            checkLevelComplete();
        }

        // 벽 충돌 체크
        function checkWallCollision() {
            const wallBounce = 0.7;

            // 왼쪽 벽
            if (ball.x - ball.radius < GAME_CONFIG.WALL_THICKNESS) {
                ball.x = GAME_CONFIG.WALL_THICKNESS + ball.radius;
                ball.vx = Math.abs(ball.vx) * wallBounce;
                createImpactParticles(ball.x, ball.y, '#ff6b6b');
            }

            // 오른쪽 벽
            if (ball.x + ball.radius > GAME_CONFIG.CANVAS_WIDTH - GAME_CONFIG.WALL_THICKNESS) {
                ball.x = GAME_CONFIG.CANVAS_WIDTH - GAME_CONFIG.WALL_THICKNESS - ball.radius;
                ball.vx = -Math.abs(ball.vx) * wallBounce;
                createImpactParticles(ball.x, ball.y, '#ff6b6b');
            }

            // 위쪽 벽
            if (ball.y - ball.radius < GAME_CONFIG.WALL_THICKNESS) {
                ball.y = GAME_CONFIG.WALL_THICKNESS + ball.radius;
                ball.vy = Math.abs(ball.vy) * wallBounce;
                createImpactParticles(ball.x, ball.y, '#ff6b6b');
            }

            // 아래쪽 벽
            if (ball.y + ball.radius > GAME_CONFIG.CANVAS_HEIGHT - GAME_CONFIG.WALL_THICKNESS) {
                ball.y = GAME_CONFIG.CANVAS_HEIGHT - GAME_CONFIG.WALL_THICKNESS - ball.radius;
                ball.vy = -Math.abs(ball.vy) * wallBounce;
                createImpactParticles(ball.x, ball.y, '#ff6b6b');
            }
        }

        // 장애물 충돌 체크
        function checkObstacleCollision() {
            for (let obstacle of obstacles) {
                // 가장 가까운 점 찾기
                const closestX = Math.max(obstacle.x, Math.min(ball.x, obstacle.x + obstacle.width));
                const closestY = Math.max(obstacle.y, Math.min(ball.y, obstacle.y + obstacle.height));

                const dx = ball.x - closestX;
                const dy = ball.y - closestY;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < ball.radius) {
                    // 충돌 처리
                    const overlap = ball.radius - distance;
                    const nx = dx / distance;
                    const ny = dy / distance;

                    ball.x += nx * overlap;
                    ball.y += ny * overlap;

                    // 반사
                    const dotProduct = ball.vx * nx + ball.vy * ny;
                    ball.vx -= 2 * dotProduct * nx;
                    ball.vy -= 2 * dotProduct * ny;

                    ball.vx *= 0.7;
                    ball.vy *= 0.7;

                    createImpactParticles(closestX, closestY, '#ffd93d');
                }
            }
        }

        // 별 수집 체크
        function checkStarCollection() {
            for (let star of stars) {
                if (star.collected) continue;

                const dx = ball.x - star.x;
                const dy = ball.y - star.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < ball.radius + star.radius) {
                    star.collected = true;
                    score += 100;
                    document.getElementById('score-display').textContent = score;

                    createCollectParticles(star.x, star.y, '#ffd700');
                    console.log('⭐ 별 수집! 점수:', score);
                }
            }
        }

        // 구멍 충돌 체크
        function checkHoleCollision() {
            for (let hole of holes) {
                const dx = ball.x - hole.x;
                const dy = ball.y - hole.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < hole.radius) {
                    // 게임 오버
                    endGame(false);
                    return;
                }
            }
        }

        // 레벨 클리어 체크
        function checkLevelComplete() {
            const allStarsCollected = stars.every(star => star.collected);

            if (allStarsCollected && stars.length > 0) {
                // 레벨 클리어
                level++;
                score += 500;
                document.getElementById('level-display').textContent = level;
                document.getElementById('score-display').textContent = score;

                console.log('🎉 레벨 클리어! 다음 레벨:', level);

                // 다음 레벨 생성
                generateLevel(level);

                // 공 위치 초기화
                ball.x = GAME_CONFIG.CANVAS_WIDTH / 2;
                ball.y = GAME_CONFIG.CANVAS_HEIGHT / 2;
                ball.vx = 0;
                ball.vy = 0;

                // 레벨 클리어 메시지
                showTemporaryMessage(`레벨 ${level - 1} 클리어!`, `레벨 ${level} 시작`);
            }
        }

        // ==================== 게임 종료 ====================
        function endGame(victory) {
            gameStarted = false;
            gameOver = true;

            console.log(victory ? '🎉 게임 클리어!' : '💀 게임 오버!');

            if (victory) {
                showOverlay(
                    '🎉 축하합니다!',
                    `모든 레벨을 클리어했습니다!<br>최종 점수: ${score}<br>시간: ${elapsedTime}초`
                );
            } else {
                showOverlay(
                    '💀 게임 오버',
                    `구멍에 빠졌습니다!<br>점수: ${score}<br>레벨: ${level}<br><br>핸드폰을 흔들어서 재시작하세요`
                );
            }
        }

        // ==================== 게임 리셋 ====================
        function resetGame() {
            console.log('🔄 게임 리셋...');

            gameStarted = false;
            gameOver = false;
            gamePaused = false;

            score = 0;
            level = 1;
            elapsedTime = 0;

            document.getElementById('score-display').textContent = score;
            document.getElementById('level-display').textContent = level;
            document.getElementById('time-display').textContent = elapsedTime;

            ball.x = GAME_CONFIG.CANVAS_WIDTH / 2;
            ball.y = GAME_CONFIG.CANVAS_HEIGHT / 2;
            ball.vx = 0;
            ball.vy = 0;

            particles = [];

            generateLevel(level);

            if (sensorConnected) {
                setTimeout(() => {
                    startGame();
                }, 1000);
            } else {
                showOverlay('Gravity Ball', '센서를 연결하세요');
            }
        }

        // ==================== 파티클 시스템 ====================
        function createImpactParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                const angle = (Math.PI * 2 * i) / 8;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * 3,
                    vy: Math.sin(angle) * 3,
                    life: 30,
                    maxLife: 30,
                    color: color,
                    size: 4
                });
            }
        }

        function createCollectParticles(x, y, color) {
            for (let i = 0; i < 20; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                particles.push({
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 60,
                    maxLife: 60,
                    color: color,
                    size: 6
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2; // 중력
                p.life--;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        // ==================== 렌더링 ====================
        function renderGame() {
            // 배경
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, GAME_CONFIG.CANVAS_WIDTH, GAME_CONFIG.CANVAS_HEIGHT);

            // 그리드 패턴
            drawGrid();

            // 벽
            drawWalls();

            // 장애물
            drawObstacles();

            // 구멍
            drawHoles();

            // 별
            drawStars();

            // 공
            drawBall();

            // 파티클
            drawParticles();

            // 센서 표시
            if (gameStarted && !gameOver) {
                drawSensorIndicator();
            }
        }

        function drawGrid() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
            ctx.lineWidth = 1;

            for (let x = 0; x < GAME_CONFIG.CANVAS_WIDTH; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, GAME_CONFIG.CANVAS_HEIGHT);
                ctx.stroke();
            }

            for (let y = 0; y < GAME_CONFIG.CANVAS_HEIGHT; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(GAME_CONFIG.CANVAS_WIDTH, y);
                ctx.stroke();
            }
        }

        function drawWalls() {
            ctx.fillStyle = '#2d3561';
            ctx.strokeStyle = '#4a5899';
            ctx.lineWidth = 2;

            // 왼쪽
            ctx.fillRect(0, 0, GAME_CONFIG.WALL_THICKNESS, GAME_CONFIG.CANVAS_HEIGHT);
            ctx.strokeRect(0, 0, GAME_CONFIG.WALL_THICKNESS, GAME_CONFIG.CANVAS_HEIGHT);

            // 오른쪽
            ctx.fillRect(GAME_CONFIG.CANVAS_WIDTH - GAME_CONFIG.WALL_THICKNESS, 0, GAME_CONFIG.WALL_THICKNESS, GAME_CONFIG.CANVAS_HEIGHT);
            ctx.strokeRect(GAME_CONFIG.CANVAS_WIDTH - GAME_CONFIG.WALL_THICKNESS, 0, GAME_CONFIG.WALL_THICKNESS, GAME_CONFIG.CANVAS_HEIGHT);

            // 위
            ctx.fillRect(0, 0, GAME_CONFIG.CANVAS_WIDTH, GAME_CONFIG.WALL_THICKNESS);
            ctx.strokeRect(0, 0, GAME_CONFIG.CANVAS_WIDTH, GAME_CONFIG.WALL_THICKNESS);

            // 아래
            ctx.fillRect(0, GAME_CONFIG.CANVAS_HEIGHT - GAME_CONFIG.WALL_THICKNESS, GAME_CONFIG.CANVAS_WIDTH, GAME_CONFIG.WALL_THICKNESS);
            ctx.strokeRect(0, GAME_CONFIG.CANVAS_HEIGHT - GAME_CONFIG.WALL_THICKNESS, GAME_CONFIG.CANVAS_WIDTH, GAME_CONFIG.WALL_THICKNESS);
        }

        function drawObstacles() {
            for (let obstacle of obstacles) {
                // 그림자
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.fillRect(obstacle.x + 5, obstacle.y + 5, obstacle.width, obstacle.height);

                // 장애물
                ctx.fillStyle = '#e74c3c';
                ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);

                // 테두리
                ctx.strokeStyle = '#c0392b';
                ctx.lineWidth = 3;
                ctx.strokeRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);

                // 하이라이트
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height / 3);
            }
        }

        function drawHoles() {
            for (let hole of holes) {
                // 외부 그림자
                const gradient = ctx.createRadialGradient(hole.x, hole.y, 0, hole.x, hole.y, hole.radius * 1.5);
                gradient.addColorStop(0, 'rgba(0, 0, 0, 0.8)');
                gradient.addColorStop(0.7, 'rgba(0, 0, 0, 0.4)');
                gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(hole.x, hole.y, hole.radius * 1.5, 0, Math.PI * 2);
                ctx.fill();

                // 구멍
                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.arc(hole.x, hole.y, hole.radius, 0, Math.PI * 2);
                ctx.fill();

                // 테두리
                ctx.strokeStyle = '#333333';
                ctx.lineWidth = 3;
                ctx.stroke();

                // 내부 하이라이트
                ctx.strokeStyle = '#555555';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(hole.x, hole.y, hole.radius * 0.7, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        function drawStars() {
            const time = Date.now() / 1000;

            for (let star of stars) {
                if (star.collected) continue;

                star.rotation += 0.02;

                // 펄스 효과
                const pulse = Math.sin(time * 3 + star.pulsePhase) * 0.2 + 1;
                const radius = star.radius * pulse;

                // 빛나는 효과
                const gradient = ctx.createRadialGradient(star.x, star.y, 0, star.x, star.y, radius * 1.5);
                gradient.addColorStop(0, 'rgba(255, 215, 0, 0.8)');
                gradient.addColorStop(0.5, 'rgba(255, 215, 0, 0.4)');
                gradient.addColorStop(1, 'rgba(255, 215, 0, 0)');

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(star.x, star.y, radius * 1.5, 0, Math.PI * 2);
                ctx.fill();

                // 별 그리기
                ctx.save();
                ctx.translate(star.x, star.y);
                ctx.rotate(star.rotation);

                ctx.fillStyle = '#ffd700';
                ctx.strokeStyle = '#ffed4e';
                ctx.lineWidth = 2;

                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const angle = (Math.PI * 2 * i) / 5 - Math.PI / 2;
                    const x = Math.cos(angle) * radius;
                    const y = Math.sin(angle) * radius;

                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }

                    const innerAngle = angle + Math.PI / 5;
                    const innerX = Math.cos(innerAngle) * radius * 0.4;
                    const innerY = Math.sin(innerAngle) * radius * 0.4;
                    ctx.lineTo(innerX, innerY);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.restore();
            }
        }

        function drawBall() {
            // 그림자
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.beginPath();
            ctx.arc(ball.x + 5, ball.y + 5, ball.radius, 0, Math.PI * 2);
            ctx.fill();

            // 공 그라디언트
            const gradient = ctx.createRadialGradient(
                ball.x - ball.radius * 0.3,
                ball.y - ball.radius * 0.3,
                ball.radius * 0.1,
                ball.x,
                ball.y,
                ball.radius
            );
            gradient.addColorStop(0, '#6dd5ed');
            gradient.addColorStop(1, '#2193b0');

            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();

            // 테두리
            ctx.strokeStyle = '#1a7a8f';
            ctx.lineWidth = 3;
            ctx.stroke();

            // 하이라이트
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.beginPath();
            ctx.arc(ball.x - ball.radius * 0.3, ball.y - ball.radius * 0.3, ball.radius * 0.3, 0, Math.PI * 2);
            ctx.fill();

            // 속도 표시 (디버그)
            if (gameStarted && !gameOver) {
                const speed = Math.sqrt(ball.vx ** 2 + ball.vy ** 2);
                if (speed > 0.5) {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(ball.x, ball.y);
                    ctx.lineTo(ball.x + ball.vx * 5, ball.y + ball.vy * 5);
                    ctx.stroke();
                }
            }
        }

        function drawParticles() {
            for (let p of particles) {
                const alpha = p.life / p.maxLife;
                ctx.fillStyle = p.color.replace(')', `, ${alpha})`).replace('rgb', 'rgba');
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawSensorIndicator() {
            const centerX = GAME_CONFIG.CANVAS_WIDTH / 2;
            const centerY = GAME_CONFIG.CANVAS_HEIGHT / 2;
            const indicatorSize = 60;

            // 배경
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.fillRect(centerX - indicatorSize, centerY - indicatorSize, indicatorSize * 2, indicatorSize * 2);

            // 십자선
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(centerX, centerY - indicatorSize);
            ctx.lineTo(centerX, centerY + indicatorSize);
            ctx.moveTo(centerX - indicatorSize, centerY);
            ctx.lineTo(centerX + indicatorSize, centerY);
            ctx.stroke();

            // 기울기 표시
            const tiltX = sensorData.tiltX * indicatorSize * 0.8;
            const tiltY = sensorData.tiltY * indicatorSize * 0.8;

            ctx.fillStyle = 'rgba(255, 100, 100, 0.7)';
            ctx.beginPath();
            ctx.arc(centerX + tiltX, centerY + tiltY, 8, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        // ==================== UI 함수 ====================
        function showOverlay(title, message) {
            const overlay = document.getElementById('overlay');
            const overlayTitle = document.getElementById('overlay-title');
            const overlayMessage = document.getElementById('overlay-message');

            overlayTitle.textContent = title;
            overlayMessage.innerHTML = message;
            overlay.classList.remove('hidden');
        }

        function hideOverlay() {
            const overlay = document.getElementById('overlay');
            overlay.classList.add('hidden');
        }

        function showTemporaryMessage(title, message) {
            showOverlay(title, message);
            setTimeout(() => {
                hideOverlay();
            }, 2000);
        }

        // ==================== 이벤트 리스너 ====================
        window.addEventListener('resize', resizeCanvas);

        canvas.addEventListener('click', () => {
            if (!gameStarted && !gameOver && sensorConnected) {
                startGame();
            } else if (gameOver) {
                resetGame();
            }
        });

        // ==================== 게임 시작 ====================
        window.addEventListener('load', () => {
            console.log('🎮 Gravity Ball 로드 완료');
            initGame();
        });
    </script>
</body>
