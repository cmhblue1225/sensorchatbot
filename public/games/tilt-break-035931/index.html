<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tilt & Break</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
        }

        canvas {
            background: #000;
            border: 2px solid #444;
            border-radius: 8px;
        }

        #session-info {
            margin: 20px 0;
            padding: 15px;
            background: #333;
            border-radius: 8px;
            text-align: center;
        }

        #session-code {
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
        }

        #sensor-status {
            margin: 10px 0;
            padding: 8px;
            border-radius: 4px;
        }

        #sensor-status.connected {
            background: #4CAF50;
        }

        #sensor-status.disconnected {
            background: #f44336;
        }

        #game-stats {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 18px;
        }

        #qr-code {
            margin: 20px auto;
            padding: 10px;
            background: white;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>Tilt & Break</h1>
    
    <div id="session-info">
        <h2>세션 코드: <span id="session-code">대기중...</span></h2>
        <div id="sensor-status" class="disconnected">센서 연결 대기중...</div>
    </div>

    <div id="qr-code"></div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="game-stats">
            Lives: <span id="lives">3</span> | Score: <span id="score">0</span>
        </div>
    </div>

    <!-- 필수 스크립트 -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/SessionSDK.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <script>
        // 게임 상태 및 객체
        const gameState = {
            ball: { x: 400, y: 550, dx: 0, dy: -4, radius: 10 },
            paddle: { x: 350, y: 570, width: 100, height: 10 },
            bricks: [],
            lives: 3,
            score: 0,
            gameStarted: false
        };

        // 캔버스 설정
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 800;
        canvas.height = 600;

        // 벽돌 초기화
        function initBricks() {
            const rows = 5;
            const cols = 8;
            const brickWidth = 80;
            const brickHeight = 20;
            const padding = 10;
            const offsetTop = 50;
            const offsetLeft = 60;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    gameState.bricks.push({
                        x: c * (brickWidth + padding) + offsetLeft,
                        y: r * (brickHeight + padding) + offsetTop,
                        width: brickWidth,
                        height: brickHeight,
                        active: true
                    });
                }
            }
        }

        // SDK 초기화
        const sdk = new SessionSDK({
            gameId: 'tilt & break',
            gameType: 'solo'
        });

        // 서버 연결
        sdk.on('connected', () => {
            console.log('✅ 서버 연결 완료');
            createSession();
        });

        function createSession() {
            sdk.createSession().then(session => {
                console.log('✅ 세션 생성됨:', session);
            }).catch(error => {
                console.error('❌ 세션 생성 실패:', error);
                alert('세션 생성 실패: ' + error.message);
            });
        }

        sdk.on('session-created', (event) => {
            const session = event.detail || event;
            document.getElementById('session-code').textContent = session.sessionCode;

            const qrUrl = `${window.location.origin}/sensor.html?session=${session.sessionCode}`;
            generateQRCode(qrUrl);
        });

        sdk.on('sensor-connected', (event) => {
            const data = event.detail || event;
            document.getElementById('sensor-status').textContent = '센서 연결됨';
            document.getElementById('sensor-status').className = 'connected';
            initGame();
        });

        sdk.on('sensor-data', (event) => {
            const data = event.detail || event;
            processSensorData(data);
        });

        function generateQRCode(url) {
            const qrContainer = document.getElementById('qr-code');
            qrContainer.innerHTML = '';

            if (typeof QRCode !== 'undefined') {
                new QRCode(qrContainer, {
                    text: url,
                    width: 200,
                    height: 200,
                    colorDark: '#000000',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.H
                });
            } else {
                const img = document.createElement('img');
                img.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}`;
                img.alt = 'QR Code';
                img.style.width = '200px';
                img.style.height = '200px';
                qrContainer.appendChild(img);
            }
        }

        function processSensorData(sensorData) {
            const { orientation } = sensorData.data;
            const tiltX = orientation.gamma / 90; // -1 ~ 1

            // 패들 이동
            gameState.paddle.x += tiltX * 10;
            gameState.paddle.x = Math.max(0, Math.min(canvas.width - gameState.paddle.width, gameState.paddle.x));

            if (!gameState.gameStarted) {
                gameState.ball.x = gameState.paddle.x + gameState.paddle.width/2;
            }
        }

        function initGame() {
            gameState.lives = 3;
            gameState.score = 0;
            gameState.gameStarted = false;
            initBricks();
            updateUI();
            gameLoop();
        }

        function updateUI() {
            document.getElementById('lives').textContent = gameState.lives;
            document.getElementById('score').textContent = gameState.score;
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 볼 이동
            if (gameState.gameStarted) {
                gameState.ball.x += gameState.ball.dx;
                gameState.ball.y += gameState.ball.dy;

                // 벽 충돌
                if (gameState.ball.x <= gameState.ball.radius || 
                    gameState.ball.x >= canvas.width - gameState.ball.radius) {
                    gameState.ball.dx *= -1;
                }
                if (gameState.ball.y <= gameState.ball.radius) {
                    gameState.ball.dy *= -1;
                }

                // 패들 충돌
                if (gameState.ball.y + gameState.ball.radius >= gameState.paddle.y &&
                    gameState.ball.x >= gameState.paddle.x &&
                    gameState.ball.x <= gameState.paddle.x + gameState.paddle.width) {
                    gameState.ball.dy = -Math.abs(gameState.ball.dy);
                }

                // 볼 떨어짐
                if (gameState.ball.y >= canvas.height) {
                    gameState.lives--;
                    updateUI();
                    if (gameState.lives <= 0) {
                        alert('Game Over!');
                        initGame();
                        return;
                    }
                    resetBall();
                }
            } else {
                gameState.ball.x = gameState.paddle.x + gameState.paddle.width/2;
                gameState.ball.y = gameState.paddle.y - gameState.ball.radius;
            }

            // 벽돌 충돌
            gameState.bricks.forEach(brick => {
                if (brick.active && checkBrickCollision(gameState.ball, brick)) {
                    brick.active = false;
                    gameState.ball.dy *= -1;
                    gameState.score += 10;
                    updateUI();
                }
            });

            // 렌더링
            drawBall();
            drawPaddle();
            drawBricks();

            requestAnimationFrame(gameLoop);
        }

        function checkBrickCollision(ball, brick) {
            return ball.x >= brick.x && 
                   ball.x <= brick.x + brick.width &&
                   ball.y >= brick.y && 
                   ball.y <= brick.y + brick.height;
        }

        function resetBall() {
            gameState.gameStarted = false;
            gameState.ball.dx = 0;
            gameState.ball.dy = -4;
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(gameState.ball.x, gameState.ball.y, gameState.ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.closePath();
        }

        function drawPaddle() {
            ctx.fillStyle = '#4CAF50';
            ctx.fillRect(gameState.paddle.x, gameState.paddle.y, 
                        gameState.paddle.width, gameState.paddle.height);
        }

        function drawBricks() {
            gameState.bricks.forEach(brick => {
                if (brick.active) {
                    ctx.fillStyle = '#ff4444';
                    ctx.fillRect(brick.x, brick.y, brick.width, brick.height);
                }
            });
        }

        // 게임 시작 이벤트
        document.addEventListener('click', () => {
            if (!gameState.gameStarted) {
                gameState.gameStarted = true;
                gameState.ball.dx = 4;
            }
        });
    </script>
</body>
</html>
