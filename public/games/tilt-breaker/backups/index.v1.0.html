<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tilt Breaker</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
        }

        canvas {
            background: #000;
            border-radius: 10px;
            width: 100%;
            height: auto;
        }

        #game-info {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #333;
            border-radius: 5px;
            margin: 10px 0;
        }

        #sensor-status {
            padding: 10px;
            margin: 10px;
            border-radius: 5px;
            text-align: center;
        }

        .connected { background: #4CAF50; }
        .disconnected { background: #f44336; }

        #qr-container {
            text-align: center;
            margin: 20px;
            padding: 20px;
            background: white;
            border-radius: 10px;
        }

        #session-code {
            font-size: 24px;
            font-weight: bold;
            margin: 10px;
            color: #000;
        }
    </style>
</head>
<body>
    <h1>Tilt Breaker</h1>
    
    <div id="game-info">
        <span>Lives: <span id="lives">3</span></span>
        <span>Score: <span id="score">0</span></span>
        <span>Stage: <span id="stage">1</span></span>
    </div>

    <div id="sensor-status" class="disconnected">
        센서 연결 대기 중...
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <div id="qr-container">
        <div>세션 코드: <span id="session-code"></span></div>
        <div id="qr-code"></div>
    </div>

    <!-- 필수 스크립트 -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/SessionSDK.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <script>
    // 게임 상수
    const PADDLE_WIDTH = 100;
    const PADDLE_HEIGHT = 20;
    const BALL_RADIUS = 10;
    const BRICK_ROW_COUNT = 5;
    const BRICK_COLUMN_COUNT = 8;
    const BRICK_WIDTH = 75;
    const BRICK_HEIGHT = 20;
    const BRICK_PADDING = 10;
    const BRICK_OFFSET_TOP = 30;
    const BRICK_OFFSET_LEFT = 30;

    // 게임 변수
    let canvas, ctx;
    let paddle = { x: 0, width: PADDLE_WIDTH, height: PADDLE_HEIGHT };
    let ball = { x: 0, y: 0, dx: 4, dy: -4, radius: BALL_RADIUS };
    let bricks = [];
    let score = 0;
    let lives = 3;
    let stage = 1;
    let gameStarted = false;

    // SDK 초기화
    const sdk = new SessionSDK({
        gameId: 'tilt breaker',
        gameType: 'solo'
    });

    // 캔버스 초기화
    function initCanvas() {
        canvas = document.getElementById('gameCanvas');
        ctx = canvas.getContext('2d');
        canvas.width = 800;
        canvas.height = 600;
        
        // 패들 초기 위치
        paddle.x = (canvas.width - paddle.width) / 2;
        paddle.y = canvas.height - paddle.height - 10;

        // 공 초기 위치
        resetBall();

        // 벽돌 초기화
        initBricks();
    }

    function initBricks() {
        for (let c = 0; c < BRICK_COLUMN_COUNT; c++) {
            bricks[c] = [];
            for (let r = 0; r < BRICK_ROW_COUNT; r++) {
                bricks[c][r] = { x: 0, y: 0, status: 1 };
            }
        }
    }

    function resetBall() {
        ball.x = paddle.x + paddle.width/2;
        ball.y = paddle.y - ball.radius;
        ball.dx = 0;
        ball.dy = 0;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 벽돌 그리기
        drawBricks();
        
        // 공 그리기
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#0095DD";
        ctx.fill();
        ctx.closePath();
        
        // 패들 그리기
        ctx.beginPath();
        ctx.rect(paddle.x, paddle.y, paddle.width, paddle.height);
        ctx.fillStyle = "#0095DD";
        ctx.fill();
        ctx.closePath();

        // 충돌 감지
        collisionDetection();

        // 게임 시작 전 공 위치 설정
        if (!gameStarted) {
            resetBall();
        } else {
            // 공 이동
            ball.x += ball.dx;
            ball.y += ball.dy;

            // 벽 충돌
            if (ball.x + ball.dx > canvas.width - ball.radius || 
                ball.x + ball.dx < ball.radius) {
                ball.dx = -ball.dx;
            }
            if (ball.y + ball.dy < ball.radius) {
                ball.dy = -ball.dy;
            }

            // 패들 충돌
            if (ball.y + ball.dy > paddle.y - ball.radius &&
                ball.x > paddle.x && 
                ball.x < paddle.x + paddle.width) {
                ball.dy = -ball.dy;
            }

            // 바닥 충돌 (생명력 감소)
            if (ball.y + ball.dy > canvas.height - ball.radius) {
                lives--;
                document.getElementById('lives').textContent = lives;
                
                if (lives <= 0) {
                    alert('Game Over! Score: ' + score);
                    document.location.reload();
                } else {
                    gameStarted = false;
                    resetBall();
                }
            }
        }

        requestAnimationFrame(draw);
    }

    function drawBricks() {
        for (let c = 0; c < BRICK_COLUMN_COUNT; c++) {
            for (let r = 0; r < BRICK_ROW_COUNT; r++) {
                if (bricks[c][r].status == 1) {
                    const brickX = (c * (BRICK_WIDTH + BRICK_PADDING)) + BRICK_OFFSET_LEFT;
                    const brickY = (r * (BRICK_HEIGHT + BRICK_PADDING)) + BRICK_OFFSET_TOP;
                    bricks[c][r].x = brickX;
                    bricks[c][r].y = brickY;
                    ctx.beginPath();
                    ctx.rect(brickX, brickY, BRICK_WIDTH, BRICK_HEIGHT);
                    ctx.fillStyle = "#0095DD";
                    ctx.fill();
                    ctx.closePath();
                }
            }
        }
    }

    function collisionDetection() {
        for (let c = 0; c < BRICK_COLUMN_COUNT; c++) {
            for (let r = 0; r < BRICK_ROW_COUNT; r++) {
                const b = bricks[c][r];
                if (b.status == 1) {
                    if (ball.x > b.x && 
                        ball.x < b.x + BRICK_WIDTH && 
                        ball.y > b.y && 
                        ball.y < b.y + BRICK_HEIGHT) {
                        ball.dy = -ball.dy;
                        b.status = 0;
                        score++;
                        document.getElementById('score').textContent = score;
                        
                        if (score == BRICK_ROW_COUNT * BRICK_COLUMN_COUNT) {
                            stage++;
                            document.getElementById('stage').textContent = stage;
                            if (stage > 30) {
                                alert('Congratulations! You win!');
                                document.location.reload();
                            } else {
                                initBricks();
                                score = 0;
                                document.getElementById('score').textContent = score;
                                gameStarted = false;
                                resetBall();
                            }
                        }
                    }
                }
            }
        }
    }

    // SDK 이벤트 처리
    sdk.on('connected', () => {
        console.log('✅ 서버 연결 완료');
        createSession();
    });

    function createSession() {
        sdk.createSession().then(session => {
            console.log('✅ 세션 생성됨:', session);
        }).catch(error => {
            console.error('❌ 세션 생성 실패:', error);
            alert('세션 생성에 실패했습니다: ' + error.message);
        });
    }

    sdk.on('session-created', (event) => {
        const session = event.detail || event;
        document.getElementById('session-code').textContent = session.sessionCode;
        
        const qrUrl = `${window.location.origin}/sensor.html?session=${session.sessionCode}`;
        generateQRCode(qrUrl);
    });

    function generateQRCode(url) {
        const qrContainer = document.getElementById('qr-code');
        qrContainer.innerHTML = '';

        if (typeof QRCode !== 'undefined') {
            new QRCode(qrContainer, {
                text: url,
                width: 200,
                height: 200,
                colorDark: '#000000',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.H
            });
        } else {
            const img = document.createElement('img');
            img.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}`;
            img.alt = 'QR Code';
            img.style.width = '200px';
            img.style.height = '200px';
            qrContainer.appendChild(img);
        }
    }

    sdk.on('sensor-connected', (event) => {
        const data = event.detail || event;
        console.log('✅ 센서 연결됨:', data.sensorId);
        
        document.getElementById('sensor-status').textContent = '센서 연결됨';
        document.getElementById('sensor-status').className = 'connected';
    });

    sdk.on('sensor-data', (event) => {
        const data = event.detail || event;
        if (!gameStarted) {
            const shake = Math.sqrt(
                data.data.acceleration.x ** 2 +
                data.data.acceleration.y ** 2 +
                data.data.acceleration.z ** 2
            );
            if (shake > 20) {
                gameStarted = true;
                ball.dx = 4;
                ball.dy = -4;
            }
        }
        
        // 패들 이동
        const tiltX = data.data.orientation.gamma / 90;
        paddle.x += tiltX * 10;
        
        // 패들 경계 체크
        if (paddle.x < 0) {
            paddle.x = 0;
        } else if (paddle.x + paddle.width > canvas.width) {
            paddle.x = canvas.width - paddle.width;
        }
    });

    sdk.on('sensor-disconnected', (event) => {
        const data = event.detail || event;
        console.log('⚠️ 센서 연결 해제:', data.sensorId);
        
        document.getElementById('sensor-status').textContent = '센서 연결 대기 중...';
        document.getElementById('sensor-status').className = 'disconnected';
    });

    // 게임 시작
    window.onload = function() {
        initCanvas();
        draw();
    };
    </script>
</body>
</html>
