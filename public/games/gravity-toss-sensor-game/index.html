<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Toss</title>
    <style>
        /* 게임 스타일 */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: white;
            overflow: hidden;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #game-canvas {
            border: 2px solid #444;
            background: #222;
        }

        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 20px;
        }

        #connection-info {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            z-index: 100;
        }

        #qr-code {
            margin: 20px auto;
            background: white;
            padding: 10px;
            border-radius: 5px;
        }

        .connected { color: #4CAF50; }
        .disconnected { color: #f44336; }

        #session-code {
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0;
        }

        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="hud">
            Score: <span id="score">0</span><br>
            Level: <span id="level">1</span><br>
            Time: <span id="time">30</span>
        </div>
        
        <div id="connection-info">
            <h2>Gravity Toss</h2>
            <p id="sensor-status" class="disconnected">센서 연결 대기 중...</p>
            <div id="session-code"></div>
            <div id="qr-code"></div>
            <p>스마트폰으로 QR코드를 스캔하세요</p>
        </div>
    </div>

    <!-- 필수 스크립트 -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/SessionSDK.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <script>
    // 게임 상수
    const GAME_WIDTH = 800;
    const GAME_HEIGHT = 600;
    const BALL_RADIUS = 15;
    const TARGET_SIZE = 40;
    const GRAVITY = 0.5;
    const THROW_POWER = 15;

    // 게임 변수
    let canvas, ctx;
    let ball = {
        x: GAME_WIDTH/2,
        y: GAME_HEIGHT - 50,
        dx: 0,
        dy: 0,
        isThrown: false
    };
    let target = {
        x: 0,
        y: 0,
        size: TARGET_SIZE
    };
    let score = 0;
    let level = 1;
    let timeLeft = 30;
    let gameStarted = false;
    let gameLoop;

    // 게임 초기화
    function initGame() {
        canvas = document.getElementById('game-canvas');
        ctx = canvas.getContext('2d');
        
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;

        resetTarget();
        startGameLoop();
    }

    // SDK 초기화
    const sdk = new SessionSDK({
        gameId: 'gravity toss',
        gameType: 'solo'
    });

    sdk.on('connected', () => {
        console.log('✅ 서버 연결 완료');
        createSession();
    });

    function createSession() {
        sdk.createSession().then(session => {
            console.log('✅ 세션 생성됨:', session);
        }).catch(error => {
            console.error('❌ 세션 생성 실패:', error);
            alert('세션 생성에 실패했습니다: ' + error.message);
        });
    }

    sdk.on('session-created', (event) => {
        const session = event.detail || event;
        document.getElementById('session-code').textContent = session.sessionCode;
        
        const qrUrl = `${window.location.origin}/sensor.html?session=${session.sessionCode}`;
        generateQRCode(qrUrl);
    });

    sdk.on('sensor-connected', (event) => {
        const data = event.detail || event;
        console.log('✅ 센서 연결됨:', data.sensorId);
        
        document.getElementById('sensor-status').textContent = '센서 연결됨';
        document.getElementById('sensor-status').className = 'connected';
        document.getElementById('connection-info').classList.add('hidden');
        
        initGame();
    });

    // 센서 데이터 처리
    sdk.on('sensor-data', (event) => {
        const data = event.detail || event;
        const { orientation, acceleration } = data.data;

        if (!ball.isThrown) {
            // 공 위치 조정
            const tiltX = orientation.gamma / 90;
            ball.x = GAME_WIDTH/2 + (tiltX * GAME_WIDTH/3);
            ball.x = Math.max(BALL_RADIUS, Math.min(GAME_WIDTH - BALL_RADIUS, ball.x));

            // 흔들기 감지로 공 던지기
            const shake = Math.sqrt(
                acceleration.x ** 2 +
                acceleration.y ** 2 +
                acceleration.z ** 2
            );
            
            if (shake > 20) {
                throwBall();
            }
        }
    });

    function throwBall() {
        if (!ball.isThrown) {
            ball.isThrown = true;
            ball.dy = -THROW_POWER;
            if (!gameStarted) {
                gameStarted = true;
                startTimer();
            }
        }
    }

    function resetBall() {
        ball.x = GAME_WIDTH/2;
        ball.y = GAME_HEIGHT - 50;
        ball.dx = 0;
        ball.dy = 0;
        ball.isThrown = false;
    }

    function resetTarget() {
        target.size = TARGET_SIZE - (level - 1) * 5;
        target.x = Math.random() * (GAME_WIDTH - target.size);
        target.y = 50 + Math.random() * (GAME_HEIGHT/2);
    }

    function checkCollision() {
        const dx = ball.x - (target.x + target.size/2);
        const dy = ball.y - (target.y + target.size/2);
        const distance = Math.sqrt(dx*dx + dy*dy);
        
        if (distance < BALL_RADIUS + target.size/2) {
            score += level * 100;
            document.getElementById('score').textContent = score;
            level++;
            document.getElementById('level').textContent = level;
            resetTarget();
            resetBall();
        }
    }

    function startTimer() {
        const timer = setInterval(() => {
            timeLeft--;
            document.getElementById('time').textContent = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(timer);
                endGame();
            }
        }, 1000);
    }

    function endGame() {
        cancelAnimationFrame(gameLoop);
        alert(`게임 종료!\n최종 점수: ${score}\n레벨: ${level}`);
        resetGame();
    }

    function resetGame() {
        score = 0;
        level = 1;
        timeLeft = 30;
        gameStarted = false;
        document.getElementById('score').textContent = score;
        document.getElementById('level').textContent = level;
        document.getElementById('time').textContent = timeLeft;
        resetBall();
        resetTarget();
        startGameLoop();
    }

    function startGameLoop() {
        function update() {
            if (ball.isThrown) {
                ball.dy += GRAVITY;
                ball.y += ball.dy;
                
                if (ball.y > GAME_HEIGHT - BALL_RADIUS) {
                    resetBall();
                }
                
                checkCollision();
            }

            // 렌더링
            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
            
            // 목표물 그리기
            ctx.fillStyle = '#4CAF50';
            ctx.fillRect(target.x, target.y, target.size, target.size);
            
            // 공 그리기
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, BALL_RADIUS, 0, Math.PI * 2);
            ctx.fill();
            
            gameLoop = requestAnimationFrame(update);
        }
        
        gameLoop = requestAnimationFrame(update);
    }

    function generateQRCode(url) {
        const qrContainer = document.getElementById('qr-code');
        qrContainer.innerHTML = '';

        if (typeof QRCode !== 'undefined') {
            new QRCode(qrContainer, {
                text: url,
                width: 200,
                height: 200,
                colorDark: '#000000',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.H
            });
        } else {
            const img = document.createElement('img');
            img.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(url)}`;
            img.alt = 'QR Code';
            img.style.width = '200px';
            img.style.height = '200px';
            qrContainer.appendChild(img);
        }
    }
    </script>
</body>
</html>
